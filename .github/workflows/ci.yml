name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q skills tools tests
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v

  self-check:
    name: dogfood (the skill checks this repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python skills/verified-code-delivery/scripts/secret_scan.py .
      - name: Validate SKILL.md
        run: python tools/build_skill.py --check
      - name: Reproducible build
        run: |
          python tools/build_skill.py --out /tmp/build-a
          python tools/build_skill.py --out /tmp/build-b
          cmp /tmp/build-a/verified-code-delivery.skill /tmp/build-b/verified-code-delivery.skill
